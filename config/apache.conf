# SSL/HTTPS Configuration (RECOMMENDED FOR PRODUCTION)
# Uncomment and configure with valid certificates
# <VirtualHost *:443>
#     ServerName local.kingstonbear.com.mx
#     DocumentRoot /project_file_path/kingstonbear/public
#     
#     SSLEngine on
#     SSLCertificateFile /etc/ssl/certs/kingstonbear.crt
#     SSLCertificateKeyFile /etc/ssl/private/kingstonbear.key
#     
#     # Security Headers
#     Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
#     Header always set X-Content-Type-Options "nosniff"
#     Header always set X-Frame-Options "SAMEORIGIN"
#     Header always set Referrer-Policy "strict-origin-when-cross-origin"
#     Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
# </VirtualHost>
